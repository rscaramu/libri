services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 10

  test:
    build:
      context: .
      target: dev
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    command: ["pytest", "-q"]
