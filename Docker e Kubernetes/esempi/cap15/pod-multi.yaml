apiVersion: v1
kind: Pod
metadata:
  name: web-con-log
spec:
  volumes:
    - name: log
      emptyDir: {}
  containers:
    - name: web
      image: nginx:1.27
      volumeMounts:
        - name: log
          mountPath: /var/log/nginx
    - name: lettore-log
      image: busybox:1.36
      args: ["sh", "-c", "tail -F /var/log/nginx/access.log"]
      volumeMounts:
        - name: log
          mountPath: /var/log/nginx
