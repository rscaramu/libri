apiVersion: apps/v1
kind: Deployment
metadata:
  name: contatore
spec:
  replicas: 2
  selector:
    matchLabels:
      app: contatore
  template:
    metadata:
      labels:
        app: contatore
    spec:
      volumes:
        - name: config
          configMap:
            name: contatore-config
            items:
              - key: app.ini
                path: app.ini
      containers:
        - name: web
          image: ghcr.io/rscaramu/contatore:2.0
          envFrom:
            - configMapRef:
                name: contatore-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: config
              mountPath: /etc/contatore
              readOnly: true
