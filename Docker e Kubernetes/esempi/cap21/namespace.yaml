apiVersion: v1
kind: Namespace
metadata:
  name: collaudo
  labels:
    ambiente: collaudo
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: collaudo
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "50"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: limiti-predefiniti
  namespace: collaudo
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
