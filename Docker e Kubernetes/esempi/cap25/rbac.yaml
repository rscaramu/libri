apiVersion: v1
kind: ServiceAccount
metadata:
  name: contatore
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lettore-config
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: contatore-lettore-config
subjects:
  - kind: ServiceAccount
    name: contatore
    namespace: default
roleRef:
  kind: Role
  name: lettore-config
  apiGroup: rbac.authorization.k8s.io
