{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "contatore.fullname" . }}-redis
  labels:
    {{- include "contatore.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "contatore.selector" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "contatore.selector" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "contatore.fullname" . }}-redis
spec:
  selector:
    {{- include "contatore.selector" . | nindent 4 }}
    app.kubernetes.io/component: redis
  ports:
    - port: 6379
{{- end }}
