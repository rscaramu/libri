apiVersion: v1
kind: Service
metadata:
  name: {{ include "contatore.fullname" . }}
  labels:
    {{- include "contatore.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "contatore.selector" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
