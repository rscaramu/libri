replicaCount: 2

image:
  repository: ghcr.io/rscaramu/contatore
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 128Mi

redis:
  enabled: true
  image: redis:7-alpine

ingress:
  enabled: false
  className: nginx
  host: contatore.local
