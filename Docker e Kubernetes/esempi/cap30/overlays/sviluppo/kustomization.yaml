apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sviluppo
namePrefix: dev-
resources:
  - ../../base
replicas:
  - name: contatore
    count: 1
images:
  - name: ghcr.io/rscaramu/contatore
    newTag: dev
configMapGenerator:
  - name: contatore-config
    behavior: merge
    literals:
      - SALUTO=Ambiente di sviluppo
