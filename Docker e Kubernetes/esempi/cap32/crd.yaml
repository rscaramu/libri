apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backup.dati.example.com
spec:
  group: dati.example.com
  names:
    kind: Backup
    plural: backup
    singular: backup
    shortNames: [bk]
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Sorgente
          type: string
          jsonPath: .spec.sorgente
        - name: Stato
          type: string
          jsonPath: .status.fase
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [sorgente, destinazione]
              properties:
                sorgente:
                  type: string
                  description: Nome del PVC da salvare
                destinazione:
                  type: string
                  pattern: "^s3://"
                pianificazione:
                  type: string
            status:
              type: object
              properties:
                fase:
                  type: string
                  enum:
                    - InAttesa
                    - InCorso
                    - Completato
                    - Fallito
                ultimoBackup:
                  type: string
                  format: date-time
