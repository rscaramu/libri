; ESP32 — La guida completa alla famiglia · capitolo 9 (PlatformIO)
; Listato 9.1 — Un `platformio.ini` per un progetto Arduino su ESP32-S3 con PSRAM. La riga `platform` punta alla piattaforma mantenuta dalla comunità, per le ragioni spiegate sotto.
; Il codice mostrato nel libro è il nucleo dell'esempio: le funzioni richiamate
; e non definite qui sono indicate nella didascalia o nel capitolo.

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/\
           releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0
