name: infrastruttura

on:
  pull_request:
    paths: ["infra/**"]
  push:
    branches: [main]
    paths: ["infra/**"]

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  piano:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.0
      - run: tofu fmt -check -recursive
      - run: tofu init -lockfile=readonly
      - run: tofu validate
      - run: tofu test
      - run: tofu plan -no-color -out=piano.tfplan
      - run: tofu show -no-color piano.tfplan > piano.txt
      - uses: actions/upload-artifact@v4
        with:
          name: piano
          path: infra/piano.*

  applica:
    if: github.ref == 'refs/heads/main'
    needs: piano
    runs-on: ubuntu-latest
    environment: produzione
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.0
      - uses: actions/download-artifact@v4
        with:
          name: piano
          path: infra
      - run: tofu init -lockfile=readonly
      - run: tofu apply piano.tfplan
